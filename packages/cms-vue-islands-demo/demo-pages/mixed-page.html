<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Mixed Page</title>
    <style>
      body { font-family: ui-sans-serif, system-ui, sans-serif; margin: 40px; line-height: 1.5; }
      .layout { display: grid; gap: 24px; }
      .news-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px; }
      .news-grid article { padding: 16px; border: 1px solid #cbd5e1; border-radius: 14px; }
    </style>
  </head>
  <body>
    <header>
      <p>Static hero content stays untouched.</p>
      <h1>Mixed HTML + Islands Demo</h1>
    </header>

    <div class="layout">
      <cms-catalog level="root" take="3">
        <template v-slot:default="{ items }">
          <nav>
            <a v-for="item in items" :key="item.id" :href="item.path">{{ item.name }}</a>
          </nav>
        </template>
      </cms-catalog>

      <section>
        <p>This paragraph is plain author HTML and should remain outside Vue islands.</p>
      </section>

      <cms-content catalog-id="news" page-size="2" content-select-type="Hot">
        <template v-slot:default="{ items }">
          <section class="news-grid">
            <article v-for="item in items" :key="item.id">
              <strong>{{ item.title }}</strong>
              <p>{{ item.summary }}</p>
            </article>
          </section>
        </template>
      </cms-content>
    </div>
  </body>
  </html>
