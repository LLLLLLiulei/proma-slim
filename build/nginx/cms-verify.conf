map $http_upgrade $connection_upgrade {
  default upgrade;
  '' close;
}

server {
  listen 8080;
  server_name _;

  access_log /var/log/nginx/access.log combined;
  error_log /var/log/nginx/error.log warn;

  location = /pagebuilder {
    return 308 /pagebuilder/;
  }

  # Keep /pagebuilder on the upstream request. PageBuilder Web owns the single
  # base-path strip before forwarding /api/* to the server service.
  location /pagebuilder/ {
    proxy_http_version 1.1;
    proxy_pass http://web:3333;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Authorization $http_authorization;
    proxy_set_header X-CMS-Cookie $http_x_cms_cookie;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $connection_upgrade;
    proxy_buffering off;
  }

  location /manager/ {
    proxy_http_version 1.1;
    proxy_pass http://cms-mock:8890;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Cookie $http_cookie;
    proxy_buffering off;
  }

  location /cms-mock/ {
    proxy_http_version 1.1;
    proxy_pass http://cms-mock:8890;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_buffering off;
  }

  location = / {
    return 302 /cms-mock/;
  }
}
