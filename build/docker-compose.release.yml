name: ai-page-builder

services:
  server:
    container_name: page-builder-server
    image: ccr.ccs.tencentyun.com/ai-page-builder/page-builder-server:${PAGE_BUILDER_IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      PORT: 8888
      AI_PAGE_BUILDER_CONFIG_DIR: /home/bun/.ai-page-builder
      AI_PAGE_BUILDER_SDK_HOME: /home/bun/.ai-page-builder/sdk-config
      AI_PAGE_BUILDER_RUNTIME_ENV: docker
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-}
      ANTHROPIC_AUTH_TOKEN: ${ANTHROPIC_AUTH_TOKEN:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-}
      ANTHROPIC_DEFAULT_OPUS_MODEL: ${ANTHROPIC_DEFAULT_OPUS_MODEL:-}
      ANTHROPIC_DEFAULT_SONNET_MODEL: ${ANTHROPIC_DEFAULT_SONNET_MODEL:-}
      ANTHROPIC_DEFAULT_HAIKU_MODEL: ${ANTHROPIC_DEFAULT_HAIKU_MODEL:-}
      CLAUDE_CODE_SUBAGENT_MODEL: ${CLAUDE_CODE_SUBAGENT_MODEL:-}
      CLAUDE_CODE_EFFORT_LEVEL: ${CLAUDE_CODE_EFFORT_LEVEL:-}
      CLAUDE_CODE_AUTO_COMPACT_WINDOW: ${CLAUDE_CODE_AUTO_COMPACT_WINDOW:-}
      CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: ${CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC:-}
      API_TIMEOUT_MS: ${API_TIMEOUT_MS:-}
      AI_PAGE_BUILDER_AGENT_MODELS_CONFIG_FILE: ${AI_PAGE_BUILDER_AGENT_MODELS_CONFIG_FILE:-}
      AI_PAGE_BUILDER_ANTHROPIC_API_KEY: ${AI_PAGE_BUILDER_ANTHROPIC_API_KEY:-}
      AI_PAGE_BUILDER_ANTHROPIC_BASE_URL: ${AI_PAGE_BUILDER_ANTHROPIC_BASE_URL:-}
      AI_PAGE_BUILDER_INTEGRATION_MODE: ${AI_PAGE_BUILDER_INTEGRATION_MODE:-}
      AI_PAGE_BUILDER_INTEGRATION_SECRET: ${AI_PAGE_BUILDER_INTEGRATION_SECRET:-}
      AI_PAGE_BUILDER_CMS_BASE_URL: ${AI_PAGE_BUILDER_CMS_BASE_URL:-}
      AI_PAGE_BUILDER_PUBLIC_ORIGIN: ${AI_PAGE_BUILDER_PUBLIC_ORIGIN:-}
      AI_PAGE_BUILDER_HANDOFF_TTL_MS: ${AI_PAGE_BUILDER_HANDOFF_TTL_MS:-}
      AI_PAGE_BUILDER_ACCESS_SESSION_TTL_MS: ${AI_PAGE_BUILDER_ACCESS_SESSION_TTL_MS:-}
      AI_PAGE_BUILDER_ACCESS_SESSION_RENEW_THRESHOLD_MS: ${AI_PAGE_BUILDER_ACCESS_SESSION_RENEW_THRESHOLD_MS:-}
      AI_PAGE_BUILDER_SYNC_EXPORT_TIMEOUT_MS: ${AI_PAGE_BUILDER_SYNC_EXPORT_TIMEOUT_MS:-0}
      AI_PAGE_BUILDER_TEMPLATE_IMPORT_MAX_ZIP_MB: ${AI_PAGE_BUILDER_TEMPLATE_IMPORT_MAX_ZIP_MB:-100}
      AI_PAGE_BUILDER_TEMPLATE_IMPORT_MAX_UNCOMPRESSED_MB: ${AI_PAGE_BUILDER_TEMPLATE_IMPORT_MAX_UNCOMPRESSED_MB:-500}
      AI_PAGE_BUILDER_CMS_USERNAME: ${AI_PAGE_BUILDER_CMS_USERNAME:-}
      AI_PAGE_BUILDER_CMS_PASSWORD: ${AI_PAGE_BUILDER_CMS_PASSWORD:-}
      AI_PAGE_BUILDER_PLAYWRIGHT_MCP_URL: ${AI_PAGE_BUILDER_PLAYWRIGHT_MCP_URL:-http://playwright:8931/mcp}
      AI_PAGE_BUILDER_INTERNAL_APP_ORIGIN: ${AI_PAGE_BUILDER_INTERNAL_APP_ORIGIN:-http://server:8888}
      IMAGE_SEARCH_PROVIDERS: ${IMAGE_SEARCH_PROVIDERS:-}
      PEXELS_API_KEY: ${PEXELS_API_KEY:-}
      PIXABAY_API_KEY: ${PIXABAY_API_KEY:-}
      UNSPLASH_ACCESS_KEY: ${UNSPLASH_ACCESS_KEY:-}
      AI_PAGE_BUILDER_BASE_PATH: ${AI_PAGE_BUILDER_BASE_PATH:-}
    volumes:
      - type: bind
        source: ${AI_PAGE_BUILDER_HOST_DATA_DIR:-${HOME:?Set HOME in your shell}/.ai-page-builder}
        target: /home/bun/.ai-page-builder
    expose:
      - "8888"

  playwright:
    container_name: page-builder-playwright
    image: ${AI_PAGE_BUILDER_PLAYWRIGHT_IMAGE:-mcr.microsoft.com/playwright:v1.57.0-jammy}
    restart: unless-stopped
    init: true
    ipc: host
    security_opt:
      - seccomp=unconfined
    volumes:
      - type: bind
        source: ${AI_PAGE_BUILDER_HOST_DATA_DIR:-${HOME:?Set HOME in your shell}/.ai-page-builder}
        target: /home/bun/.ai-page-builder
    command:
      - sh
      - -lc
      - >-
        PLAYWRIGHT_EXECUTABLE_PATH="$(find /ms-playwright/chromium-* \( -path '*chrome-linux/chrome' -o -path '*chrome-linux64/chrome' \) | head -1)";
        if [ -z "$$PLAYWRIGHT_EXECUTABLE_PATH" ]; then
          echo "Chromium executable not found under /ms-playwright" >&2;
          exit 1;
        fi;
        exec npx -y @playwright/mcp@latest --host 0.0.0.0 --port 8931 --headless --allowed-hosts '*' --executable-path "$$PLAYWRIGHT_EXECUTABLE_PATH"
    expose:
      - "8931"

  web:
    container_name: page-builder-web
    image: ccr.ccs.tencentyun.com/ai-page-builder/page-builder-web:${PAGE_BUILDER_IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      - server
    environment:
      PORT: 3333
      AI_PAGE_BUILDER_SERVER_ORIGIN: http://server:8888
      AI_PAGE_BUILDER_BASE_PATH: ${AI_PAGE_BUILDER_BASE_PATH:-}
      AI_PAGE_BUILDER_HIDDEN_TOOLBAR_ITEMS: ${AI_PAGE_BUILDER_HIDDEN_TOOLBAR_ITEMS:-}
    ports:
      - "${PAGE_BUILDER_PORT:-3333}:3333"
