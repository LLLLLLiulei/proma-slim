name: ai-page-builder

services:
  server:
    container_name: server
    image: ai-page-builder-server
    build:
      context: ..
      dockerfile: build/Dockerfile.page-builder-app
    environment:
      PORT: 8888
      AI_PAGE_BUILDER_CONFIG_DIR: /home/bun/.ai-page-builder
      AI_PAGE_BUILDER_SDK_HOME: /home/bun/.ai-page-builder/sdk-config
      AI_PAGE_BUILDER_RUNTIME_ENV: docker
      ANTHROPIC_API_KEY: ${AI_PAGE_BUILDER_ANTHROPIC_API_KEY:?Set AI_PAGE_BUILDER_ANTHROPIC_API_KEY in build/.env.standalone.example, build/.env.cms.example, or your shell}
      ANTHROPIC_BASE_URL: ${AI_PAGE_BUILDER_ANTHROPIC_BASE_URL:-}
      AI_PAGE_BUILDER_INTEGRATION_MODE: ${AI_PAGE_BUILDER_INTEGRATION_MODE:-}
      AI_PAGE_BUILDER_INTEGRATION_SECRET: ${AI_PAGE_BUILDER_INTEGRATION_SECRET:-}
      AI_PAGE_BUILDER_CMS_BASE_URL: ${AI_PAGE_BUILDER_CMS_BASE_URL:-}
      AI_PAGE_BUILDER_PUBLIC_ORIGIN: ${AI_PAGE_BUILDER_PUBLIC_ORIGIN:-}
      AI_PAGE_BUILDER_HANDOFF_TTL_MS: ${AI_PAGE_BUILDER_HANDOFF_TTL_MS:-}
      AI_PAGE_BUILDER_ACCESS_SESSION_TTL_MS: ${AI_PAGE_BUILDER_ACCESS_SESSION_TTL_MS:-}
      AI_PAGE_BUILDER_SYNC_EXPORT_TIMEOUT_MS: ${AI_PAGE_BUILDER_SYNC_EXPORT_TIMEOUT_MS:-0}
      AI_PAGE_BUILDER_CMS_USERNAME: ${AI_PAGE_BUILDER_CMS_USERNAME:-}
      AI_PAGE_BUILDER_CMS_PASSWORD: ${AI_PAGE_BUILDER_CMS_PASSWORD:-}
      AI_PAGE_BUILDER_PLAYWRIGHT_MCP_URL: ${AI_PAGE_BUILDER_PLAYWRIGHT_MCP_URL:-http://playwright:8931/mcp}
      AI_PAGE_BUILDER_INTERNAL_APP_ORIGIN: ${AI_PAGE_BUILDER_INTERNAL_APP_ORIGIN:-http://server:8888}
      AI_PAGE_BUILDER_BASE_PATH: ${AI_PAGE_BUILDER_BASE_PATH:-}
    volumes:
      - type: bind
        source: ${AI_PAGE_BUILDER_HOST_DATA_DIR:-${HOME:?Set HOME in your shell}/.ai-page-builder}
        target: /home/bun/.ai-page-builder
    expose:
      - "8888"

  playwright:
    container_name: playwright
    image: mcr.microsoft.com/playwright:v1.57.0-jammy
    init: true
    ipc: host
    volumes:
      - type: bind
        source: ${AI_PAGE_BUILDER_HOST_DATA_DIR:-${HOME:?Set HOME in your shell}/.ai-page-builder}
        target: /home/bun/.ai-page-builder
    command:
      - sh
      - -lc
      - >-
        PLAYWRIGHT_EXECUTABLE_PATH="$(find /ms-playwright/chromium-* -path '*chrome-linux/chrome' | head -1)";
        if [ -z "$$PLAYWRIGHT_EXECUTABLE_PATH" ]; then
          echo "Chromium executable not found under /ms-playwright" >&2;
          exit 1;
        fi;
        exec npx -y @playwright/mcp@latest --host 0.0.0.0 --port 8931 --headless --allowed-hosts '*' --executable-path "$$PLAYWRIGHT_EXECUTABLE_PATH"
    expose:
      - "8931"

  web:
    container_name: web
    image: ai-page-builder-web
    build:
      context: ..
      dockerfile: build/Dockerfile.page-builder-web
    depends_on:
      - server
    environment:
      PORT: 3333
      AI_PAGE_BUILDER_SERVER_ORIGIN: http://server:8888
      AI_PAGE_BUILDER_BASE_PATH: ${AI_PAGE_BUILDER_BASE_PATH:-}
    ports:
      - "${PAGE_BUILDER_PORT:-3333}:3333"
