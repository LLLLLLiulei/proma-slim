name: ai-page-builder-cms-verify

services:
  server:
    container_name: cms-verify-server
    image: ai-page-builder-server
    build:
      context: ..
      dockerfile: build/Dockerfile.page-builder-app
    environment:
      PORT: 8888
      AI_PAGE_BUILDER_CONFIG_DIR: /home/bun/.ai-page-builder
      AI_PAGE_BUILDER_SDK_HOME: /home/bun/.ai-page-builder/sdk-config
      AI_PAGE_BUILDER_RUNTIME_ENV: docker
      AI_PAGE_BUILDER_ANTHROPIC_API_KEY: ${AI_PAGE_BUILDER_ANTHROPIC_API_KEY:-cms-verify-dummy-key}
      AI_PAGE_BUILDER_ANTHROPIC_BASE_URL: ${AI_PAGE_BUILDER_ANTHROPIC_BASE_URL:-}
      ANTHROPIC_API_KEY: ${AI_PAGE_BUILDER_ANTHROPIC_API_KEY:-cms-verify-dummy-key}
      ANTHROPIC_BASE_URL: ${AI_PAGE_BUILDER_ANTHROPIC_BASE_URL:-}
      AI_PAGE_BUILDER_INTEGRATION_MODE: cms
      AI_PAGE_BUILDER_INTEGRATION_SECRET: ${AI_PAGE_BUILDER_INTEGRATION_SECRET:-cms-verify-secret}
      AI_PAGE_BUILDER_CMS_BASE_URL: http://nginx:8080/manager
      AI_PAGE_BUILDER_PUBLIC_ORIGIN: ${CMS_VERIFY_PUBLIC_ORIGIN:-http://localhost:8088}
      AI_PAGE_BUILDER_BASE_PATH: /pagebuilder
      AI_PAGE_BUILDER_HANDOFF_TTL_MS: ${AI_PAGE_BUILDER_HANDOFF_TTL_MS:-120000}
      AI_PAGE_BUILDER_ACCESS_SESSION_TTL_MS: ${AI_PAGE_BUILDER_ACCESS_SESSION_TTL_MS:-28800000}
      AI_PAGE_BUILDER_ACCESS_SESSION_RENEW_THRESHOLD_MS: ${AI_PAGE_BUILDER_ACCESS_SESSION_RENEW_THRESHOLD_MS:-3600000}
      AI_PAGE_BUILDER_SYNC_EXPORT_TIMEOUT_MS: ${AI_PAGE_BUILDER_SYNC_EXPORT_TIMEOUT_MS:-30000}
      AI_PAGE_BUILDER_CMS_USERNAME: ${AI_PAGE_BUILDER_CMS_USERNAME:-cms-verify-user}
      AI_PAGE_BUILDER_CMS_PASSWORD: ${AI_PAGE_BUILDER_CMS_PASSWORD:-cms-verify-pass}
      AI_PAGE_BUILDER_PLAYWRIGHT_MCP_URL: ${AI_PAGE_BUILDER_PLAYWRIGHT_MCP_URL:-http://playwright:8931/mcp}
      AI_PAGE_BUILDER_INTERNAL_APP_ORIGIN: ${AI_PAGE_BUILDER_INTERNAL_APP_ORIGIN:-http://server:8888}
      IMAGE_SEARCH_PROVIDERS: ${IMAGE_SEARCH_PROVIDERS:-}
      PEXELS_API_KEY: ${PEXELS_API_KEY:-}
      PIXABAY_API_KEY: ${PIXABAY_API_KEY:-}
      UNSPLASH_ACCESS_KEY: ${UNSPLASH_ACCESS_KEY:-}
    volumes:
      - type: bind
        source: ./.cms-verify-data
        target: /home/bun/.ai-page-builder
    expose:
      - "8888"

  playwright:
    container_name: cms-verify-playwright
    image: mcr.microsoft.com/playwright:v1.57.0-jammy
    init: true
    ipc: host
    volumes:
      - type: bind
        source: ./.cms-verify-data
        target: /home/bun/.ai-page-builder
    command:
      - sh
      - -lc
      - >-
        PLAYWRIGHT_EXECUTABLE_PATH="$(find /ms-playwright/chromium-* \( -path '*chrome-linux/chrome' -o -path '*chrome-linux64/chrome' \) | head -1)";
        if [ -z "$$PLAYWRIGHT_EXECUTABLE_PATH" ]; then
          echo "Chromium executable not found under /ms-playwright" >&2;
          exit 1;
        fi;
        exec npx -y @playwright/mcp@latest --host 0.0.0.0 --port 8931 --headless --allowed-hosts '*' --executable-path "$$PLAYWRIGHT_EXECUTABLE_PATH"
    expose:
      - "8931"

  web:
    container_name: cms-verify-web
    image: ai-page-builder-web
    build:
      context: ..
      dockerfile: build/Dockerfile.page-builder-web
    depends_on:
      - server
    environment:
      PORT: 3333
      AI_PAGE_BUILDER_SERVER_ORIGIN: http://server:8888
      AI_PAGE_BUILDER_BASE_PATH: /pagebuilder
    expose:
      - "3333"

  cms-mock:
    container_name: cms-verify-cms-mock
    image: oven/bun:1.2.5
    working_dir: /mock
    environment:
      PORT: 8890
      PAGE_BUILDER_BASE_PATH: /pagebuilder
      PAGE_BUILDER_INTEGRATION_SECRET: ${AI_PAGE_BUILDER_INTEGRATION_SECRET:-cms-verify-secret}
      CMS_VERIFY_COOKIE: ${CMS_VERIFY_COOKIE:-CurrentSite=1;ZUSID=cms-verify}
    volumes:
      - type: bind
        source: ./cms-mock
        target: /mock
        read_only: true
    command: ["bun", "server.ts"]
    expose:
      - "8890"

  nginx:
    container_name: cms-verify-nginx
    image: nginx:1.29-alpine
    depends_on:
      - web
      - cms-mock
    volumes:
      - type: bind
        source: ./nginx/cms-verify.conf
        target: /etc/nginx/conf.d/default.conf
        read_only: true
    ports:
      - "${CMS_VERIFY_PORT:-8088}:8080"
